flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/studio_logo.png"

flutter:
  shaders:
  - packages/thanos_snap_effect/shader/thanos_snap_effect.glsl

  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/music/
    - assets/animations/
   # - assets/my_database.db

  # - images/a_dot_ham.jpeg


  fonts:
    - family: Lato
      fonts:
        - asset:  assets/fonts/Lato-Black.ttf
        - asset:  assets/fonts/Lato-Light.ttf
    #         style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Black.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
    #         weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
        - asset: assets/fonts/OpenSans-BoldItalic.ttf
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
        - asset: assets/fonts/OpenSans-ExtraBoldItalic.ttf
        - asset: assets/fonts/OpenSans-Semibold.ttf
        - asset: assets/fonts/OpenSans-SemiboldItalic.ttf
    - family: FFF
      fonts:
        - asset: assets/fonts/FFF_Tusj.ttf

    - family: Arizonia
      fonts:
        - asset: assets/fonts/Arizonia-Regular.ttf

    - family: ProductSans
      fonts:
        - asset: assets/fonts/ProductSans-Regular.ttf
        - asset: assets/fonts/ProductSans-Bold.ttf
        - asset: assets/fonts/ProductSans-BoldItalic.ttf
        - asset: assets/fonts/ProductSans-Italic.ttf


